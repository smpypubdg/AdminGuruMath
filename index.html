    async function getDbAndAuth() {
      if (window._firebaseDb) return window._firebaseDb;
      if (!window.FirebaseLib || typeof __firebase_config === 'undefined') return null;
      
      const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, getFirestore } = window.FirebaseLib;
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'eduteach-pro-db';
      const firebaseConfig = JSON.parse(__firebase_config);
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        try { await signInAnonymously(auth); } catch (e) {}
      }

      if (!auth.currentUser) return null;

      window._firebaseDb = { db, appId, auth };
      return window._firebaseDb;
    }

                                      onChange={(e) => handleAssessmentChange(siswa.id, 'ats', e.target.value)}
                                      placeholder="-"
                                      className="w-14 py-1.5 px-1 text-center bg-[#090f21] border border-amber-800 rounded-lg text-xs font-bold text-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-500"
                                    />
                                  </td>
                                  <td className="py-2 px-2 text-center bg-[#090f21]/40 border-r border-blue-900/60">
                                    <input
                                      type="number"
                                      min="0"
                                      max="100"
                                      value={grades.aas ?? ''}
                                      onChange={(e) => handleAssessmentChange(siswa.id, 'aas', e.target.value)}
                                      placeholder="-"
                                      className="w-14 py-1.5 px-1 text-center bg-[#090f21] border border-blue-800 rounded-lg text-xs font-bold text-sky-300 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                                    />
                                  </td>
                                  <td className="py-3.5 px-4 text-center bg-[#090f21]/60">
                                    <div className="flex items-center justify-center gap-2">
                                      <span className="text-sm font-extrabold text-sky-50">{finalGrade}</span>
                                      {finalGrade !== '-' && (
                                        <span className={`px-2 py-0.5 text-[10px] font-bold rounded-full ${
                                          isPassed ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-rose-950 text-rose-300 border border-rose-800'
                                        }`}>
                                          {isPassed ? 'Tuntas' : 'Remidial'}
                                        </span>
                                      )}
                                    </div>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* JURNAL KEGIATAN TAB */}
                {activeTab === 'jurnal' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fadeIn">
                    <div className="lg:col-span-5 bg-[#111c38] p-6 rounded-2xl border border-[#a1c6ea]/30 shadow-md space-y-4">
                      <div className="flex items-center justify-between border-b border-blue-900/60 pb-3">
                        <h3 className="font-bold text-sky-50 text-base flex items-center gap-2">
                          <Icon name="BookOpen" className="w-5 h-5 text-[#a1c6ea]" />
                          {journalForm.id ? 'Edit Jurnal Pembelajaran' : 'Input Jurnal Kegiatan'}
                        </h3>
                        {journalForm.id && (
                          <button
                            onClick={() => setJournalForm({
                              id: null, classRoom: selectedClass, period: selectedPeriod, subject: selectedSubject, date: selectedDate, content: '', notes: ''
                            })}
                            className="text-xs font-semibold text-sky-300 hover:underline"
                          >
                            Batal Edit
                          </button>
                        )}
                      </div>

                      <form onSubmit={handleSaveJournal} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-sky-200 mb-1">Tanggal</label>
                          <input
                            type="date"
                            value={journalForm.date}
                            onChange={(e) => setJournalForm({ ...journalForm, date: e.target.value })}
                            className="w-full px-3.5 py-2 bg-[#090f21] border border-[#a1c6ea]/30 rounded-xl text-xs font-medium text-sky-100 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                            required
                          />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-semibold text-sky-200 mb-1">Pilih Kelas</label>
                            <select
                              value={journalForm.classRoom}
                              onChange={(e) => setJournalForm({ ...journalForm, classRoom: e.target.value })}
                              className="w-full px-3 py-2 bg-[#090f21] border border-[#a1c6ea]/30 rounded-xl text-xs font-medium text-sky-100 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                            >
                              {INITIAL_CLASSES.map(c => <option key={c} value={c} className="bg-[#0b1329] text-sky-100">{c}</option>)}
                            </select>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-sky-200 mb-1">Mata Pelajaran</label>
                            <select
                              value={journalForm.subject}
                              onChange={(e) => setJournalForm({ ...journalForm, subject: e.target.value })}
                              className="w-full px-3 py-2 bg-[#090f21] border border-[#a1c6ea]/30 rounded-xl text-xs font-medium text-sky-100 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                            >
                              <option value="Matematika" className="bg-[#0b1329] text-sky-100">Matematika</option>
                              <option value="Informatika" className="bg-[#0b1329] text-sky-100">Informatika</option>
                              <option value="Pembinaan Wali Kelas" className="bg-[#0b1329] text-sky-100">Pembinaan Wali Kelas</option>
                            </select>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-semibold text-sky-200 mb-1">Jam Mulai *</label>
                            <input
                              type="text"
                              value={journalForm.startTime || ''}
                              onChange={(e) => setJournalForm({ ...journalForm, startTime: e.target.value })}
                              placeholder="Misal: 08.00"
                              className="w-full px-3.5 py-2 bg-[#090f21] border border-[#a1c6ea]/30 rounded-xl text-xs font-medium text-sky-100 placeholder-sky-400/50 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                              required
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-sky-200 mb-1">Jam Selesai *</label>
                            <input
                              type="text"
                              value={journalForm.endTime || ''}
                              onChange={(e) => setJournalForm({ ...journalForm, endTime: e.target.value })}
                              placeholder="Misal: 09.20"
                              className="w-full px-3.5 py-2 bg-[#090f21] border border-[#a1c6ea]/30 rounded-xl text-xs font-medium text-sky-100 placeholder-sky-400/50 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                              required
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-sky-200 mb-1">
                            Uraian & Rincian Kegiatan Pembelajaran *
                          </label>
                          <textarea
                            rows={4}
                            value={journalForm.content}
                            onChange={(e) => setJournalForm({ ...journalForm, content: e.target.value })}
                            placeholder="Tuliskan ringkasan materi, misalnya: Konsep Himpunan, Bilangan Rasional..."
                            className="w-full px-3.5 py-2.5 bg-[#090f21] border border-[#a1c6ea]/30 rounded-xl text-xs font-medium text-sky-100 placeholder-sky-400/50 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-sky-200 mb-1">
                            Catatan Kejadian Khusus / Keterangan Kelas
                          </label>
                          <textarea
                            rows={2}
                            value={journalForm.notes}
                            onChange={(e) => setJournalForm({ ...journalForm, notes: e.target.value })}
                            placeholder="Misal: Hambatan kelas, kedisiplinan siswa..."
                            className="w-full px-3.5 py-2 bg-[#090f21] border border-[#a1c6ea]/30 rounded-xl text-xs font-medium text-sky-100 placeholder-sky-400/50 focus:outline-none focus:ring-2 focus:ring-[#a1c6ea]"
                          />
                        </div>

                        <button
                          type="submit"
                          className="w-full py-3 bg-[#a1c6ea] text-[#0b1329] hover:bg-[#8bb7e2] rounded-xl text-xs font-bold transition-all shadow-lg shadow-blue-950 flex items-center justify-center gap-2"
                        >
                          <Icon name="Save" className="w-4 h-4" />
                          {journalForm.id ? 'Perbarui Jurnal' : 'Simpan Jurnal Pembelajaran'}
                        </button>
                      </form>
                    </div>

                    <div className="lg:col-span-7 bg-[#111c38] p-6 rounded-2xl border border-[#a1c6ea]/30 shadow-md space-y-4">
                      <div className="flex items-center justify-between border-b border-blue-900/60 pb-3">
                        <h3 className="font-bold text-sky-50 text-base">Riwayat Jurnal Mengajar</h3>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => {
                              setPrintConfig({
                                type: 'jurnal',
                                classRoom: selectedClass,
                                subject: selectedSubject,
                                startDate: rekapStartDate,
                                endDate: rekapEndDate
                              });
                              setIsPrintModalOpen(true);
                            }}
                            className="px-3 py-1 bg-[#090f21] hover:bg-[#152347] text-[#a1c6ea] border border-[#a1c6ea]/40 rounded-lg text-xs font-semibold flex items-center gap-1"
                          >
                            <Icon name="Printer" className="w-3.5 h-3.5 text-[#a1c6ea]" /> Cetak Jurnal
                          </button>
                          <span className="text-xs font-semibold text-sky-200 bg-[#090f21] px-2.5 py-1 rounded-lg border border-[#a1c6ea]/30">
                            Total: {journals.length}
                          </span>
                        </div>
                      </div>

                      <div className="space-y-4">
                        {journals.length === 0 ? (
                          <div className="text-center py-12 text-sky-400/60 text-xs">
                            Belum ada data jurnal pembelajaran yang diinput.
                          </div>
                        ) : (
                          journals.map((j) => (
                            <div key={j.id} className="p-4 rounded-xl border border-blue-900/60 bg-[#090f21] hover:bg-[#152347]/40 transition-all space-y-2 relative group">
                              <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                  <span className="px-2.5 py-0.5 bg-[#0b1329] text-[#a1c6ea] font-bold text-xs rounded-md border border-[#a1c6ea]/30">
                                    {j.classRoom}
                                  </span>
                                  <span className="text-xs font-bold text-sky-50">{j.subject}</span>
                                  <span className="text-[11px] text-sky-300/80">• {j.period}</span>
                                </div>

                                <div className="flex items-center gap-2">
                                  <span className="text-[11px] text-sky-300/80 font-medium">{j.date}</span>
                                  <button onClick={() => handleEditJournal(j)} className="p-1.5 text-sky-300 hover:text-sky-100 rounded-lg hover:bg-[#152347]">
                                    <Icon name="Edit2" className="w-3.5 h-3.5" />
                                  </button>
                                  <button onClick={() => handleDeleteJournal(j.id)} className="p-1.5 text-rose-400 hover:text-rose-100 rounded-lg hover:bg-rose-950">
                                    <Icon name="Trash2" className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>
                              <p className="text-xs text-sky-100 font-normal leading-relaxed">{j.content}</p>
                              {j.notes && (
                                <div className="text-[11px] bg-amber-950/80 text-amber-200 p-2 rounded-lg border border-amber-900/60 font-medium">
                                  <strong>Catatan:</strong> {j.notes}
                                </div>
                              )}
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                )}

              </main>

              {/* Footer */}
              <footer className="py-5 px-6 border-t border-[#a1c6ea]/20 bg-[#090f21] text-center text-xs text-sky-300 mt-auto">
                <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                  <p className="font-medium text-sky-200">
                    EduTeach Pro &copy; {new Date().getFullYear()} — Dashboard Guru Terpadu SMP YPU Bandung
                  </p>
                  <p className="text-sky-300 font-medium">
                    Designed & Developed by <span className="font-bold text-[#a1c6ea]">@ihsanmsyahid</span>
                  </p>
                </div>
              </footer>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
